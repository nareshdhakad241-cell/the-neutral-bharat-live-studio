plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neutralbharat.livestudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.neutralbharat.livestudio'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FFmpegKit is archived upstream; this dependency may need a maintained
    // replacement if the Maven artifact is no longer available.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.9'
    // FFmpegKit references this Android stack-trace helper at runtime.
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}
